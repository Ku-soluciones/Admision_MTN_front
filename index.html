<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://ik.imagekit.io/11mmsqbe5/mtn-admisiones/Logo%20II.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Sistema de Admisión MTN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'azul-monte-tabor': '#1e3a8a',
                    'dorado-nazaret': '#f59e0b',
                    'blanco-pureza': '#ffffff',
                    'gris-piedra': '#6b7280',
                    'verde-esperanza': '#059669',
                    'rojo-sagrado': '#dc2626',
                },
                fontFamily: {
                    sans: ['Montserrat', 'sans-serif'],
                    serif: ['Lato', 'sans-serif'],
                }
            }
        }
    }
    </script>
</head>
<body class="bg-gray-100">
    <!-- HashRouter redirect bridge ──────────────────────────────────
         Los HTTP 302 del BFF no preservan el fragmento "#" en la URL.
         Cuando el navegador llega a /interview/confirmation-result?params,
         este script se ejecuta ANTES de cargar React/Vite y redirige a
         /#/interview/confirmation-result?params para que HashRouter lo procese.
    ───────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        var hashRedirectPaths = ['/interview/confirmation-result'];
        var p = window.location.pathname;
        // Normalizar: quitar trailing slash para comparar
        if (p.length > 1 && p.charAt(p.length - 1) === '/') p = p.slice(0, -1);
        if (hashRedirectPaths.indexOf(p) !== -1) {
          window.location.replace(
            window.location.origin + '/#' + p + window.location.search
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
